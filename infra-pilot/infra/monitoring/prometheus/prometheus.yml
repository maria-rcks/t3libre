global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
      timeout: 3s

scrape_configs:
  - job_name: prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: monitoring
          component: prometheus

  - job_name: infra-pilot-services
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets:
          - "management-panel:3001"
          - "orchestrator-agent:8500"
        labels:
          project: infra-pilot
          environment: production

  - job_name: postgres-exporter
    scrape_interval: 15s
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: database
          component: postgres
