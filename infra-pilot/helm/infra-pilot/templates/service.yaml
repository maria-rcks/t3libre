apiVersion: v1
kind: Service
metadata:
  name: {{ include "infra-pilot.fullname" . }}-orchestrator
  labels:
    {{- include "infra-pilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "infra-pilot.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator