[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test* *Test
python_functions = test_* *_test

markers =
  unit: Unit tests
  integration: Integration tests
  e2e: End-to-end tests
  smoke: Smoke tests
  slow: Slow tests that may be skipped in CI
  network: Tests that require network access
  asyncio: Async tests handled by pytest-asyncio

addopts = --strict-markers --cov=cli/ipilot --cov-report=xml:coverage.xml --cov-report=html:coverage_html --cov-report=term-missing --cov-fail-under=100
pythonpath = .
    cli
filterwarnings =
  error
  ignore::DeprecationWarning
