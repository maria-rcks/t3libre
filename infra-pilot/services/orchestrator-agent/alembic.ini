[alembic]
script_location = alembic
prepend_sys_path = .
# The URL below is overridden at runtime by alembic/env.py, which reads the
# same DB_* environment variables as config.py (or DATABASE_URL).
sqlalchemy.url = postgresql://infra_pilot:CHANGE_ME@localhost:5432/infra_pilot

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
